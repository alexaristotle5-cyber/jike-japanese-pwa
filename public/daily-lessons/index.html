<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e9" />
  <title>JLPT N2 每日训练｜即刻日语</title>
  <style>
    :root {
      --paper: #f7f2e9;
      --paper-2: #fffdf8;
      --ink: #25231f;
      --muted: #746f65;
      --line: #ddd4c5;
      --red: #b74335;
      --red-dark: #7e2c25;
      --green: #2f6f58;
      --gold: #b38a3b;
      --shadow: 0 16px 48px rgba(62, 48, 34, .10);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(183, 67, 53, .09), transparent 30rem),
        linear-gradient(180deg, #f2eadf 0, var(--paper) 22rem, #f5efe6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans CJK JP", "PingFang SC", sans-serif;
      line-height: 1.75;
    }

    button, textarea, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .hero {
      padding: max(28px, env(safe-area-inset-top)) 20px 28px;
      border-bottom: 1px solid rgba(126, 44, 37, .12);
    }

    .hero-inner, .layout { width: min(1120px, 100%); margin: 0 auto; }
    .eyebrow { color: var(--red); font-weight: 800; letter-spacing: .12em; font-size: 13px; }
    h1 { margin: 8px 0 10px; font-family: "Songti SC", "Yu Mincho", serif; font-size: clamp(32px, 7vw, 58px); line-height: 1.15; }
    .hero p { max-width: 760px; margin: 0; color: var(--muted); }

    .status-bar {
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .status.is-playing { color: var(--green); border-color: rgba(47,111,88,.35); }
    .stop-all {
      min-height: 38px; padding: 7px 14px; border-radius: 999px;
      border: 1px solid rgba(183,67,53,.35); background: transparent; color: var(--red); font-weight: 750;
    }

    .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; padding: 28px 18px 70px; }
    .sidebar { position: sticky; top: 18px; align-self: start; }
    .panel { background: rgba(255,253,248,.86); border: 1px solid rgba(189,176,157,.7); border-radius: var(--radius); box-shadow: var(--shadow); }
    .sidebar-panel { padding: 16px; }
    .sidebar h2 { font-size: 17px; margin: 2px 4px 12px; }
    .lesson-list { display: grid; gap: 9px; }
    .lesson-button {
      width: 100%; text-align: left; border: 1px solid transparent; border-radius: 15px; background: transparent; padding: 12px;
      color: var(--ink); cursor: pointer;
    }
    .lesson-button:hover, .lesson-button:focus-visible { background: #fff; border-color: var(--line); outline: none; }
    .lesson-button.is-active { background: var(--ink); color: white; }
    .lesson-button small { display: block; opacity: .68; margin-top: 2px; }

    .content { min-width: 0; }
    .lesson-header { padding: 28px; margin-bottom: 18px; overflow: hidden; position: relative; }
    .lesson-header::after { content: "日"; position: absolute; right: 14px; top: -28px; font-family: serif; font-size: 130px; color: rgba(183,67,53,.055); }
    .lesson-header h2 { font-family: "Songti SC", "Yu Mincho", serif; font-size: clamp(27px, 5vw, 42px); line-height: 1.3; margin: 5px 0 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 5px 10px; border-radius: 999px; background: #eee5d7; color: #665e52; font-size: 13px; }

    .section { padding: 24px; margin: 18px 0; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .section-title h3 { margin: 0; font-family: "Songti SC", serif; font-size: 25px; }
    .section-title span { color: var(--muted); font-size: 13px; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .card { padding: 18px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.66); }
    .card h4 { margin: 0 0 7px; font-size: 20px; }
    .jp { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif; font-size: 18px; line-height: 1.9; }
    .translation, .note { color: var(--muted); }
    .translation { margin-top: 5px; }
    .note { font-size: 14px; border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 10px; }

    .audio-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .audio-btn, .answer-btn, .check-btn {
      border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px; padding: 8px 12px; font-weight: 720; cursor: pointer;
    }
    .audio-btn:active, .answer-btn:active, .check-btn:active { transform: translateY(1px); }
    .audio-btn.is-playing { background: var(--green); color: white; border-color: var(--green); }
    .audio-btn.slow { color: var(--red-dark); }

    .grammar-box { border-left: 5px solid var(--gold); }
    .grammar-meta { display: grid; gap: 8px; padding: 12px 14px; background: #f5eddf; border-radius: 13px; }
    .compare-row { margin-top: 13px; padding-top: 13px; border-top: 1px dashed var(--line); }
    .label { display: inline-flex; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--red); margin-bottom: 4px; }

    .question { margin: 15px 0; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.7); }
    .question-number { color: var(--red); font-size: 13px; font-weight: 850; letter-spacing: .08em; }
    .question h4 { margin: 7px 0 11px; font-size: 18px; font-weight: 700; }
    .options { display: grid; gap: 8px; margin: 12px 0; }
    .option { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; background: #faf7f1; border-radius: 11px; border: 1px solid transparent; }
    .option:has(input:checked) { border-color: var(--gold); background: #fff9e9; }
    .answer-space {
      width: 100%; min-height: 92px; resize: vertical; margin-top: 12px; padding: 13px;
      border: 1px solid var(--line); border-radius: 13px; background: #fff; color: var(--ink);
    }
    .question-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .answer-btn { background: var(--ink); color: white; border-color: var(--ink); }
    .check-result { min-height: 24px; margin-top: 8px; font-weight: 800; }
    .check-result.good { color: var(--green); }
    .check-result.bad { color: var(--red); }
    .answer-panel { display: none; margin-top: 14px; padding: 15px; border-radius: 13px; background: #f1ebdf; border-left: 4px solid var(--red); }
    .answer-panel.is-open { display: block; }
    .answer-panel strong { color: var(--red-dark); }

    .reading-text { white-space: pre-wrap; padding: 19px; background: #fbf8f2; border-radius: 16px; border: 1px solid var(--line); }
    .memory { padding: 17px; background: #28352f; color: white; border-radius: 16px; font-weight: 750; }
    .next-step { border: 1px solid rgba(183,67,53,.35); background: #fff8f5; }

    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .footer { text-align: center; color: var(--muted); padding: 20px; font-size: 13px; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; padding-left: 12px; padding-right: 12px; }
      .sidebar { position: static; }
      .lesson-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid { grid-template-columns: 1fr; }
      .section, .lesson-header { padding: 19px; }
    }

    @media (max-width: 480px) {
      .lesson-list { grid-template-columns: 1fr; }
      .audio-btn, .answer-btn, .check-btn { min-height: 44px; }
      .hero { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">即刻日语 · DAILY PRACTICE</div>
      <h1>JLPT N2 每日训练</h1>
      <p>从 N5/N4 起步，以词汇记忆、自然现代日语和动漫风格例句为重点。每道题先作答，再点击查看答案与逐句解析。</p>
      <div class="status-bar">
        <div id="audioStatus" class="status">🎧 点击任意日语旁的播放按钮</div>
        <button id="stopAll" class="stop-all" type="button">■ 停止朗读</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="panel sidebar-panel">
        <h2>课程目录</h2>
        <div id="lessonList" class="lesson-list"><div class="empty">加载中…</div></div>
      </div>
    </aside>
    <div id="content" class="content"><div class="panel empty">正在读取课程数据…</div></div>
  </main>
  <footer class="footer">学习进度和作答内容仅保存在当前浏览器。</footer>

  <script>
    const state = {
      catalog: null,
      lesson: null,
      currentFile: null,
      audio: new Audio(),
      speechToken: 0,
      activeButton: null,
      audioFallbackTimer: null,
      rate: 1
    };

    state.audio.preload = 'auto';
    state.audio.playsInline = true;
    state.audio.preservesPitch = true;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]));
    const keyFor = (id) => `jlpt-daily:${state.currentFile}:${id}`;

    function setStatus(text, playing = false) {
      const el = $('#audioStatus');
      el.textContent = text;
      el.classList.toggle('is-playing', playing);
    }

    function stopAudio() {
      state.speechToken += 1;
      clearTimeout(state.audioFallbackTimer);
      state.audio.pause();
      state.audio.removeAttribute('src');
      state.audio.load();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (state.activeButton) state.activeButton.classList.remove('is-playing');
      state.activeButton = null;
      setStatus('🎧 已停止朗读');
    }

    function splitSpeech(text) {
      const clean = String(text || '').replace(/\s+/g, ' ').trim();
      if (!clean) return [];
      const pieces = clean.match(/[^。！？!?]+[。！？!?]?/g) || [clean];
      const chunks = [];
      for (const piece of pieces) {
        if (piece.length <= 150) chunks.push(piece.trim());
        else {
          for (let i = 0; i < piece.length; i += 120) chunks.push(piece.slice(i, i + 120));
        }
      }
      return chunks.filter(Boolean);
    }

    function ttsUrls(text) {
      const q = encodeURIComponent(text);
      return [
        `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q=${q}`,
        `https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=ja&q=${q}`
      ];
    }

    function systemSpeak(text, rate, token, done) {
      if (!('speechSynthesis' in window) || token !== state.speechToken) return done();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = Math.max(.55, Math.min(1.15, rate));
      const voices = speechSynthesis.getVoices();
      utterance.voice = voices.find(v => /^ja(-|_)/i.test(v.lang) && /Kyoko|O-ren|Nanami|Hattori/i.test(v.name)) || voices.find(v => /^ja(-|_)/i.test(v.lang)) || null;
      utterance.onend = done;
      utterance.onerror = done;
      speechSynthesis.speak(utterance);
    }

    function playExternalChunk(text, rate, token, done) {
      const urls = ttsUrls(text);
      let sourceIndex = 0;
      let settled = false;

      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(state.audioFallbackTimer);
        done();
      };

      const trySource = () => {
        if (token !== state.speechToken) return finish();
        if (sourceIndex >= urls.length) {
          return systemSpeak(text, rate, token, finish);
        }
        state.audio.src = urls[sourceIndex++];
        state.audio.playbackRate = rate;
        state.audio.onended = finish;
        state.audio.onerror = trySource;
        state.audio.oncanplay = () => { state.audio.playbackRate = rate; };
        const playPromise = state.audio.play();
        if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(trySource);
        state.audioFallbackTimer = setTimeout(() => {
          if (!settled && state.audio.paused) trySource();
        }, 4500);
      };

      trySource();
    }

    function playSpeech(text, rate, button) {
      stopAudio();
      const token = ++state.speechToken;
      const chunks = splitSpeech(text);
      if (!chunks.length) return;
      state.activeButton = button;
      button?.classList.add('is-playing');
      setStatus(rate < 1 ? '🐢 慢速朗读中…' : '🔊 正常语速朗读中…', true);
      let index = 0;
      const next = () => {
        if (token !== state.speechToken) return;
        if (index >= chunks.length) {
          button?.classList.remove('is-playing');
          state.activeButton = null;
          setStatus('✅ 朗读完成');
          return;
        }
        playExternalChunk(chunks[index++], rate, token, next);
      };
      next();
    }

    function audioButtons(text) {
      if (!text) return '';
      const safe = escapeHtml(text);
      return `<div class="audio-actions">
        <button type="button" class="audio-btn" data-speech="${safe}" data-rate="1">🔊 播放</button>
        <button type="button" class="audio-btn slow" data-speech="${safe}" data-rate="0.76">🐢 慢速</button>
      </div>`;
    }

    function questionHtml(q, index, prefix = 'q') {
      const answerId = `${prefix}-${q.id || index}`;
      const saved = localStorage.getItem(keyFor(answerId)) || '';
      const options = Array.isArray(q.options) ? `<div class="options">${q.options.map(opt => {
        const letter = String(opt).trim().charAt(0);
        const checked = saved === letter ? 'checked' : '';
        return `<label class="option"><input type="radio" name="${escapeHtml(answerId)}" value="${escapeHtml(letter)}" ${checked}><span>${escapeHtml(opt)}</span></label>`;
      }).join('')}</div>` : '';
      const textarea = !q.options ? `<textarea class="answer-space" data-save-id="${escapeHtml(answerId)}" placeholder="先在这里写下你的答案……">${escapeHtml(saved)}</textarea>` : '';
      return `<article class="question" data-question-id="${escapeHtml(answerId)}" data-answer="${escapeHtml(q.answer || '')}">
        <div class="question-number">${escapeHtml(q.group || '练习')} · ${String(index + 1).padStart(2, '0')}</div>
        <h4>${escapeHtml(q.prompt)}</h4>
        ${audioButtons(q.speech)}
        ${options}${textarea}
        <div class="question-tools">
          ${q.options ? '<button type="button" class="check-btn">检查选择</button>' : ''}
          <button type="button" class="answer-btn">查看答案与解析</button>
        </div>
        <div class="check-result"></div>
        <div class="answer-panel">
          <div><strong>答案：</strong><span class="jp">${escapeHtml(q.answer || '')}</span></div>
          ${audioButtons(q.speech || q.answer)}
          <div class="note"><strong>解析：</strong>${escapeHtml(q.explanation || '—')}</div>
        </div>
      </article>`;
    }

    function vocabularyHtml(items = []) {
      return `<section class="panel section">
        <div class="section-title"><h3>核心词汇</h3><span>${items.length} 个</span></div>
        <div class="grid">${items.map(item => `<article class="card">
          <h4 class="jp">${escapeHtml(item.word)}</h4>
          <div>${escapeHtml(item.meaning)}</div>
          ${audioButtons(item.speech)}
          <div class="compare-row">
            <div class="jp">${escapeHtml(item.example)}</div>
            <div class="translation">${escapeHtml(item.translation)}</div>
            ${audioButtons(item.exampleSpeech)}
          </div>
          <div class="note">${escapeHtml(item.note)}</div>
        </article>`).join('')}</div>
      </section>`;
    }

    function grammarHtml(items = []) {
      return items.map(item => `<section class="panel section grammar-box">
        <div class="section-title"><h3>${escapeHtml(item.title)}</h3><span>核心语法</span></div>
        <div class="grammar-meta"><div><strong>接续：</strong>${escapeHtml(item.structure)}</div><div><strong>语感：</strong>${escapeHtml(item.meaning)}</div></div>
        ${(item.examples || []).map(example => `<div class="compare-row">
          <div class="label">${escapeHtml(example.label)}</div>
          <div class="jp">${escapeHtml(example.text)}</div>
          <div class="translation">${escapeHtml(example.translation)}</div>
          ${audioButtons(example.speech)}
        </div>`).join('')}
        <div class="note"><strong>易混对比：</strong>${escapeHtml(item.contrast)}</div>
      </section>`).join('');
    }

    function styleHtml(items = []) {
      if (!items.length) return '';
      return `<section class="panel section"><div class="section-title"><h3>表达风格对比</h3><span>书面 · 口语 · 动漫</span></div>
        <div class="grid">${items.map(item => `<article class="card"><div class="label">${escapeHtml(item.label)}</div><div class="jp">${escapeHtml(item.text)}</div><div class="translation">${escapeHtml(item.translation)}</div>${audioButtons(item.speech)}</article>`).join('')}</div>
      </section>`;
    }

    function readingHtml(reading) {
      if (!reading) return '';
      return `<section class="panel section">
        <div class="section-title"><h3>短篇阅读</h3><span>${escapeHtml(reading.title || '')}</span></div>
        <div class="reading-text jp">${escapeHtml(reading.text)}</div>
        ${audioButtons(reading.speech)}
        <div>${(reading.questions || []).map((q, i) => questionHtml(q, i, 'reading')).join('')}</div>
      </section>`;
    }

    function outputHtml(items = []) {
      if (!items.length) return '';
      return `<section class="panel section"><div class="section-title"><h3>输出训练</h3><span>翻译 · 造句</span></div>${items.map((q, i) => questionHtml(q, i, 'output')).join('')}</section>`;
    }

    function renderLesson(lesson) {
      state.lesson = lesson;
      const m = lesson.meta;
      $('#content').innerHTML = `<section class="panel lesson-header">
          <div class="eyebrow">DAY ${String(m.day).padStart(2, '0')} · ${escapeHtml(m.date)}</div>
          <h2>${escapeHtml(m.title)}</h2>
          <p>${escapeHtml(m.goal)}</p>
          <div class="chips"><span class="chip">${escapeHtml(m.level)}</span><span class="chip">约 ${escapeHtml(m.duration)} 分钟</span><span class="chip">${escapeHtml(m.grammar)}</span></div>
        </section>
        ${vocabularyHtml(lesson.vocabulary)}
        ${grammarHtml(lesson.grammarNotes)}
        ${styleHtml(lesson.styleComparison)}
        <section class="panel section"><div class="section-title"><h3>分项练习</h3><span>先答后看</span></div>${(lesson.questions || []).map((q, i) => questionHtml(q, i)).join('')}</section>
        ${readingHtml(lesson.reading)}
        ${outputHtml(lesson.output)}
        <section class="panel section"><div class="section-title"><h3>记忆锚点</h3></div><div class="memory">${escapeHtml(lesson.memory || '')}</div></section>
        <section class="panel section next-step"><div class="section-title"><h3>明确下一步</h3><span>今天只做这一件</span></div><p>${escapeHtml(lesson.nextStep?.instruction || '')}</p><div class="reading-text jp">${escapeHtml(lesson.nextStep?.text || '')}</div>${audioButtons(lesson.nextStep?.speech)}</section>`;
      bindInteractions();
    }

    function bindInteractions() {
      $$('.audio-btn').forEach(btn => btn.addEventListener('click', () => {
        const text = btn.dataset.speech || '';
        const rate = Number(btn.dataset.rate || 1);
        if (btn === state.activeButton) stopAudio();
        else playSpeech(text, rate, btn);
      }));

      $$('.answer-btn').forEach(btn => btn.addEventListener('click', () => {
        const panel = btn.closest('.question')?.querySelector('.answer-panel');
        panel?.classList.toggle('is-open');
        btn.textContent = panel?.classList.contains('is-open') ? '收起答案解析' : '查看答案与解析';
      }));

      $$('.check-btn').forEach(btn => btn.addEventListener('click', () => {
        const box = btn.closest('.question');
        if (!box) return;
        const selected = box.querySelector('input[type="radio"]:checked');
        const result = box.querySelector('.check-result');
        if (!selected) {
          result.textContent = '请先选择一个答案。'; result.className = 'check-result bad'; return;
        }
        localStorage.setItem(keyFor(box.dataset.questionId), selected.value);
        const good = selected.value === String(box.dataset.answer).trim().charAt(0);
        result.textContent = good ? '✓ 回答正确' : '✗ 暂不正确，先想想再展开解析';
        result.className = `check-result ${good ? 'good' : 'bad'}`;
      }));

      $$('input[type="radio"]').forEach(input => input.addEventListener('change', () => {
        const box = input.closest('.question');
        if (box) localStorage.setItem(keyFor(box.dataset.questionId), input.value);
      }));

      $$('.answer-space').forEach(area => area.addEventListener('input', () => {
        localStorage.setItem(keyFor(area.dataset.saveId), area.value);
      }));
    }

    async function loadLesson(file) {
      stopAudio();
      state.currentFile = file;
      $('#content').innerHTML = '<div class="panel empty">正在打开课程…</div>';
      try {
        const response = await fetch(`./lessons/${file}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        renderLesson(await response.json());
        $$('.lesson-button').forEach(btn => btn.classList.toggle('is-active', btn.dataset.file === file));
        history.replaceState(null, '', `#${encodeURIComponent(file.replace('.json',''))}`);
      } catch (error) {
        $('#content').innerHTML = `<div class="panel empty">课程读取失败：${escapeHtml(error.message)}。请确认网页通过 GitHub Pages 的 HTTPS 地址打开。</div>`;
      }
    }

    async function initialize() {
      try {
        const response = await fetch('./lessons/index.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.catalog = await response.json();
        const lessons = state.catalog.lessons || [];
        $('#lessonList').innerHTML = lessons.map(item => `<button type="button" class="lesson-button" data-file="${escapeHtml(item.file)}"><strong>Day ${String(item.day).padStart(2,'0')}｜${escapeHtml(item.title)}</strong><small>${escapeHtml(item.date)} · ${escapeHtml(item.summary)}</small></button>`).join('');
        $$('.lesson-button').forEach(btn => btn.addEventListener('click', () => loadLesson(btn.dataset.file)));
        const hash = decodeURIComponent(location.hash.replace('#',''));
        const requested = lessons.find(item => item.file.replace('.json','') === hash);
        const first = requested || lessons[lessons.length - 1];
        if (first) loadLesson(first.file);
        else $('#content').innerHTML = '<div class="panel empty">课程库暂时为空。</div>';
      } catch (error) {
        $('#lessonList').innerHTML = '<div class="empty">课程索引读取失败</div>';
        $('#content').innerHTML = `<div class="panel empty">无法加载课程：${escapeHtml(error.message)}</div>`;
      }
    }

    $('#stopAll').addEventListener('click', stopAudio);
    window.addEventListener('beforeunload', stopAudio);
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    initialize();
  </script>
</body>
</html>
